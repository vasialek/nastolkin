name: Android CI

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and lint
        run: ./gradlew :games:test :app:testDebugUnitTest :app:lintDebug

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nastolkin-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT

          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          ./gradlew :app:assembleDebug

#      - name: Build APK
#        run: ./gradlew :app:assembleDebug

      - name: Apply version to APK name
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          VERSION=$(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json")
          APK_NAME="nastolkin-${VERSION}-${GITHUB_RUN_NUMBER}-debug"

          cp "$APK_DIR/app-debug.apk" "$APK_DIR/${APK_NAME}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}.apk
          if-no-files-found: error
          retention-days: 90
